aid: termius
name: Termius
description: >-
  Termius is a modern, cross-platform SSH client for DevOps professionals, network
  engineers, and infrastructure teams, available on Windows, macOS, Linux, iOS,
  iPadOS, and Android. It provides secure remote access with encrypted team vaults,
  shared and synced credentials, SSH keys, snippets, SFTP, port forwarding, jump
  hosts, and session organization. For programmatic use Termius ships the API
  Bridge — a self-hosted REST API (OpenAPI 3.0) that encrypts infrastructure data
  locally and pushes hosts and groups into a Termius Team vault — plus an official
  command-line client. The company also runs a Security Center with a SOC 2 report.
