detail: >-
  The Termius API Bridge OpenAPI declares no HTTP-layer securitySchemes: the REST
  API is served by a container the customer runs locally (default localhost:8080)
  and is reached over the local network. Trust is established out of band — using
  the API Bridge requires a Termius Team plan, and an API Bridge is provisioned
  from the Team's API Bridge page, which issues the key the bridge uses to
  authenticate to the Termius cloud and to encrypt infrastructure data locally
  before pushing it into the Team vault. There is no public OAuth or API-key
  scheme for direct cloud API access.
schemes: []
